name: BrawlHub
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  BrawlHub:
    type: application
    platform: iOS
    sources: [BrawlHub]
    info:
      path: BrawlHub/Info.plist
      properties:
        CFBundleDisplayName: BrawlHub
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: BrawlHub/BrawlHub.entitlements
      properties:
        get-task-allow: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.brawlhub
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
